name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  sqlite-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, curl, zip, gd, pdo_sqlite, bcmath
          coverage: none

      - name: Validate Composer
        run: composer validate --strict --no-check-publish

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/notrejour_test.sqlite

      - name: Check style
        run: vendor/bin/pint --test

      - name: Run static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G

      - name: Audit PHP dependencies
        run: composer audit --locked

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run build
      - name: Run SQLite test suite
        run: php artisan test

  mysql-production:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: notrejour_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      CACHE_STORE: array
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: notrejour_test
      DB_USERNAME: root
      DB_PASSWORD: root
      ADMIN_PASSWORD: ci-only-not-a-production-secret
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, curl, zip, gd, pdo_mysql, bcmath
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Verify MySQL migrations and rollback
        run: |
          php artisan migrate:fresh --force
          php artisan migrate:rollback --step=1 --force
          php artisan migrate --force

      - name: Verify production seeding on MySQL
        run: |
          php artisan db:seed --force
          php artisan dar-hijama:install

      - name: Verify Notre Jour critical workflows on MySQL
        run: php artisan test --testsuite=Modules --filter='/Invitation|Rsvp/'

      - name: Verify Dar Hijama workflows on MySQL 8.4
        run: php artisan test Applications/DarHijama/Tests/Feature
